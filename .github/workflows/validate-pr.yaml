name: Validate Pull Request

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  salesforce-pr-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Salesforce CLI
        run: |
          npm install -g @salesforce/cli

      - name: Create private key
        run: |
          printf '%s\n' '${{ secrets.SF_PRIVATE_KEY }}' > server.key
          chmod 600 server.key

      - name: Authenticate to Target Org
        run: |
          sf org login jwt \
            --client-id "${{ secrets.SF_CLIENT_ID }}" \
            --jwt-key-file server.key \
            --username "${{ secrets.SF_USERNAME }}" \
            --instance-url "${{ secrets.SF_INSTANCE_URL }}" \
            --set-default \
            --alias targetOrg

      - name: Verify Salesforce Authentication
        run: |
          sf org display --target-org targetOrg

      - name: Run Validation and Generate Coverage Report
        run: |
          sf project deploy start \
            --dry-run \
            --target-org targetOrg \
            --test-level RunLocalTests \
            --wait 30 \
            --coverage-formatters json \
            --results-dir artifacts

      - name: Enforce 75% Code Coverage Threshold
        run: |
          COVERAGE=$(jq '.total.lines.pct' artifacts/coverage/coverage-summary.json)

          echo "Current Total Code Coverage: $COVERAGE%"

          if (( $(echo "$COVERAGE < 75.0" | bc -l) )); then
            echo "❌ Validation Failed: Total code coverage ($COVERAGE%) is below the required 75% threshold."
            exit 1
          else
            echo "✅ Validation Passed: Total code coverage ($COVERAGE%) meets the 75% requirement."
          fi

      - name: Remove private key
        if: always()
        run: |
          rm -f server.key